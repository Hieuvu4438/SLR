[build-system]
requires = ["setuptools==81.0.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ocem-slret"
version = "0.1.0"
description = "Overlap-Constrained Evidence Matching for sign-language retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.15.22",
]
solver = [
  "numpy==2.5.3",
  "scipy==1.17.1",
  "torch==2.11.0",
]

[project.scripts]
ocem = "ocem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
