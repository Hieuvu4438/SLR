[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmgr-slret"
version = "0.1.0"
description = "Protocol-Matched Gallery Risk for sign-language retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
pmgr = "pmgr.runtime:main"
pmgr-train = "pmgr.train:main"
pmgr-evaluate = "pmgr.evaluate:main"
pmgr-diagnose = "pmgr.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
