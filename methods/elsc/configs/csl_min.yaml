extends: ../../../configs/csl_base.yaml
experiment: csl_daily_elsc_min
method: elsc

model:
  init_checkpoint: required_same_dev_selected_baseline_checkpoint
  teacher_checkpoint: required_dev_selected_baseline_checkpoint
  teacher_selection_provenance: required_dev_selection_record
  require_init_equals_teacher: true
  backbone_frozen: true
  logit_scale_frozen: true
  adapter:
    enabled: true

cache:
  path: artifacts/cache/csl_daily_train_elsc_v1
  require_hash_match: true
  require_train_only: true
  local_view: canonical
  allow_support_remap: false
  negatives_source: train_visual_neighbors_v1
  negative_language: en
  max_targets_per_video: 2
  max_negatives_per_target: 5
  random_span_duration_tolerance: 0.10

mining:
  tau_word: 0.07
  tau_time: 0.07
  mass_min: 0.60
  min_support_tokens: 2
  max_duration_fraction: 0.35
  confidence_min: 0.45
  view_iou_min: 0.50
  second_mode_mass: 0.30
  min_distinct_videos_per_word: 3
  max_occurrences_per_word: 32
  visual_cosine_min: 0.70
  graph_top_k: 10
  mutual_neighbors: true
  pos_filter: false

loss:
  lexical_weight: 0.1

train:
  epochs: 20
