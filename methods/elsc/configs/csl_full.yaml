extends: csl_min.yaml
experiment: csl_daily_elsc_full

model:
  init_checkpoint: required_selected_min_checkpoint
  require_init_equals_teacher: false

sources:
  temporal_metadata_root: artifacts/features_reextracted/csl_temporal_metadata

evidence:
  enabled: true
  require_verified_rf_metadata: true
  max_pairs_per_video: 1
  batch_fraction: 0.25
  encoder_microbatch_size: 32
  score_microbatch_size: 32
  activation_checkpoint: true
  teacher_margin_min: 0.02
  dependence_margin: 0.02
  dependence_weight: 0.1
  invariance_weight: 0.1
  huber_delta: 0.05
  mask_fill: zero
  control_same_token_count: true
  control_duration_tolerance: 0.10

cache:
  path: artifacts/cache/csl_daily_full_train_v1

train:
  # Step-matched against csl_continued_min.yaml for the gated seed-42 pilot.
  epochs: 10
